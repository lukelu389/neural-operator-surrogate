# T1.3 deterministic numerical fixtures, not sampled data or a frozen protocol.
# All 32 box corners plus its arithmetic center; retain every failed quote.
version: 1
spot: 1.0
rate: 0.02
dividend_yield: 0.0
parameter_order: [v0, kappa, theta, sigma, rho]
parameter_box:
  v0: [0.01, 0.25]
  kappa: [0.5, 5.0]
  theta: [0.01, 0.25]
  sigma: [0.1, 1.0]
  rho: [-0.95, -0.1]
fixtures: corners_plus_arithmetic_center
option_types: [call, put]
grid:
  maturity_year_fractions: [[1, 12], [2, 12], [3, 12], [6, 12], [9, 12], [1, 1], [3, 2], [2, 1]]
  z_linspace: {start: -2.5, stop: 2.5, count: 15}
  k_scale: 0.2
cos:
  selected_terms: 4096
  selected_width: 28.0
  reference_terms: 8192
  reference_width: 36.0
  quote_batch_size: 120
iv:
  price_atol: 0.0
  price_rtol: 1.0e-10
  iv_atol: 1.0e-10
  min_normalized_vega: 1.0e-4
  volatility_upper: 5.0
  max_iterations: 100
roundtrip:
  # Same scale as IVSettings: max(S exp(-qT), K exp(-rT)).
  max_normalized_price_residual: 1.0e-10
