# T1.4 prerequisite: deterministic corner/center convergence diagnostics only.
# This is not a dataset, a population coverage estimate, or a frozen config.
version: 1
spot: 1.0
rate: 0.02
dividend_yield: 0.0
parameter_order: [v0, kappa, theta, sigma, rho]
parameter_box:
  v0: [0.01, 0.25]
  kappa: [0.5, 5.0]
  theta: [0.01, 0.25]
  sigma: [0.1, 1.0]
  rho: [-0.95, -0.1]
fixtures: corners_plus_arithmetic_center
option_types: [call, put]
grid:
  maturity_year_fractions: [[1, 12], [2, 12], [3, 12], [6, 12], [9, 12], [1, 1], [3, 2], [2, 1]]
  z_linspace: {start: -2.5, stop: 2.5, count: 15}
  k_scale: 0.2
cos:
  selected_terms: 16384
  selected_width: 64.0
  reference_terms: 32768
  reference_width: 80.0
  quote_batch_size: 15
iv:
  price_atol: 0.0
  price_rtol: 1.0e-10
  iv_atol: 1.0e-10
  min_normalized_vega: 1.0e-4
  volatility_upper: 5.0
  max_iterations: 100
roundtrip:
  max_normalized_price_residual: 1.0e-10
convergence:
  # Price scale is max(S exp(-qT), K exp(-rT)), as in IVSettings.
  max_normalized_price_difference: 1.0e-8
  max_price_difference_over_vega: 1.0e-5
riccati:
  # Worst low-Feller, long-maturity corner identified by the T1.3 diagnostic.
  maturity: 2.0
  parameters: [0.01, 0.5, 0.01, 1.0, -0.95]
  frequencies: [0.25, 1.0, 3.0, 10.0, 30.0, 100.0, 300.0, 1000.0]
  step_counts: [16384, 32768]
  max_absolute_error: 1.0e-9
